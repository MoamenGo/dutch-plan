*{box-sizing:border-box}

.bar{height:10px;background:#3b3832;border-radius:6px;overflow:hidden;margin:12px 0 4px}

.stat{font-size:13px;color:#D9D2C5}

.now{background:#fff;border:2px solid #F08A4B;border-radius:14px;padding:16px;margin-bottom:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card.done{background:#F2F7F1;border-color:#C9DCC6}
.card.cur{border:2px solid #F08A4B}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase}
.tag{font:600 11px system-ui;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);border-radius:4px;padding:3px 6px}
.card h3{margin:6px 0 4px;font-size:18px;line-height:1.25}
.card p{margin:0 0 12px;color:var(--muted);font-size:15px}
.links{display:flex;gap:8px}
.links a{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #E0D6C6;border-radius:10px;background:#FFFCF7;color:var(--link);font:600 14px system-ui;text-decoration:none}
.links a:active{background:#F3E9DC}
label.chk{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:8px;font-size:15px}
label.chk input{width:24px;height:24px;accent-color:#0F6B63}
.phase{border-left:6px solid;background:#fff;border-radius:12px;padding:14px;margin:0 0 16px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.phase h2{margin:0 0 6px;font-size:20px}
.phase p{margin:0 0 6px;color:var(--muted)}
.tools{display:grid;grid-template-columns:1fr;gap:10px}
.tools a{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;min-height:56px}
.tools b{display:block;color:var(--link)}
.tools span{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:600 15px system-ui}
.btn.alt{background:#fff;color:var(--ink)}
input[type=date]{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:16px system-ui;background:#fff}
.note{font-size:14px;color:var(--muted)}
ul{padding-left:20px}
@media(min-width:700px){.tools{grid-template-columns:1fr 1fr}}
</style>
</head>

 if(tab==="home"){
  if(!S.start){
   h+='<div class="now"><h2>Start your plan</h2><p>Pick the day you begin week 1. The app then shows your current week.</p><div class="row"><input type="date" id="sd" value="'+iso(new Date())+'" aria-label="Start date"><button class="btn" id="go">Start</button></div></div>';
  }else{
   var f=findWeek(cw);
   h+='<div class="now"><h2>This week</h2>'+weekCard(f[0],f[1],cw)+'<div class="row"><button class="btn alt" id="chg">Change start date</button></div></div>';
  }
  h+=DATA.map(function(p){return'<section class="phase" style="border-left-color:'+p.color+'"><h2>'+p.id+" · "+p.route+'</h2><p><b>'+p.span+'</b> · '+esc(p.title)+'</p><p>'+esc(p.aim)+'</p><p class="note">Checkpoint: '+esc(p.check)+'</p><button class="btn alt" data-t="'+p.id+'">Open '+p.id+' weeks</button></section>'}).join("");
 }else if(tab==="tools"){
  h+='<div class="tools">'+TOOLS.map(function(t){return'<a href="'+esc(t[2])+'" target="_blank" rel="noopener"><b>'+esc(t[0])+'</b><span>'+esc(t[1])+'</span></a>'}).join("")+'</div><p class="note">Links marked search open a search on that topic, so they keep working if a site moves.</p>';
 }else if(tab==="how"){
  h+='<div class="card"><h3>Weekly rhythm</h3><ul><li>Mon, Tue, Thu, Fri: about 1.5 hours, one input session and one output session.</li><li>Wednesday: 30 minutes of flashcards only.</li><li>Saturday and Sunday: about 1.5 hours, long listening or reading, weekly review and speaking.</li></ul><h3>Daily formula (about 90 minutes)</h3><ul><li>15 min Anki review</li><li>30 min lesson or grammar</li><li>20 min listening</li><li>15 min speaking or writing</li><li>10 min: 5 new sentences, add the best to Anki</li></ul><h3>Three rules</h3><ul><li>Input first: about 60% listening and reading until B1.</li><li>Learn words inside sentences, never alone.</li><li>Speak from week 1 and book an exchange partner by week 8.</li></ul><h3>If you fall behind</h3><ul><li>Missed a few days: resume the current week, do not catch up.</li><li>Missed 2+ weeks: repeat the last full week, then continue.</li></ul></div><div class="card"><h3>Your data</h3><p>Progress is saved only on this device. It works offline once installed.</p><button class="btn alt" id="rst">Reset progress</button></div>';
 }else{
  var p=DATA.filter(function(x){return x.id===tab})[0];
  h+='<section class="phase" style="border-left-color:'+p.color+'"><h2>'+p.id+" · "+p.route+'</h2><p><b>'+p.span+'</b> · '+esc(p.title)+'</p><p class="note">Checkpoint: '+esc(p.check)+'</p></section>'+p.weeks.map(function(w){return weekCard(p,w,cw)}).join("");
 }
 v.innerHTML=h;
}
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-t]");
 if(t){tab=t.getAttribute("data-t");render();window.scrollTo(0,0);
  if(DATA.some(function(p){return p.id===tab})){var cw=curWeek();var el=cw&&document.getElementById("w"+cw);if(el)el.scrollIntoView({block:"center"})}return}
 if(e.target.id==="go"){var s=document.getElementById("sd").value;if(s){S.start=s;save();render()}}
 if(e.target.id==="chg"){S.start=null;save();render()}
 if(e.target.id==="rst"){if(confirm("Reset all progress on this device?")){S={start:null,done:{}};save();render()}}
});
document.addEventListener("change",function(e){
 var n=e.target.getAttribute&&e.target.getAttribute("data-w");
 if(n){S.done[n]=e.target.checked;save();var c=e.target.closest(".card");if(c)c.classList.toggle("done",e.target.checked);top()}
});
render();
if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
